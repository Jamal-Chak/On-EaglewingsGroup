name: On-Eaglewings CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: on-eaglewings-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/reusable-node-quality.yml
    with:
      node-version: "20"
      run-typecheck: true
      run-lint: true
      run-build: true
